<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Profil dan Pengantar Perkuliahan | I Wayan Wiprayoga Wisesa (ITERA)</title>

    <!-- Favicon ITERA -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./images/logo-itera.png" />

    <!-- Google Fonts: Google Sans Flex & Google Sans Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Google+Sans+Flex:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Early Projector Aspect Ratio Detection to prevent layout shift -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('reveal-aspect-ratio');
          var is43 = saved === '4:3' || (!saved && (window.innerWidth / window.innerHeight <= 1.45));
          document.documentElement.setAttribute('data-ratio', is43 ? '4-3' : '16-9');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
